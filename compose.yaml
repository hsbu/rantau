services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rantau_demo
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: rantau_demo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rantau_demo -d rantau_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - demo_db:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://rantau_demo:local_demo_only@db:5432/rantau_demo
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      AGENT_API_ORIGIN: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  demo_db:
